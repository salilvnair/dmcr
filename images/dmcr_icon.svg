<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0.5" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Feather crests -->
  <path d="M38 30 L30 8 L42 24" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 28 L50 6 L57 22" stroke="#86efac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 30 L70 8 L58 24" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="50" cy="38" r="14" stroke="url(#gGreen)" stroke-width="4"/>

  <!-- Eye -->
  <circle cx="55" cy="34" r="4" fill="#4ade80"/>
  <circle cx="55" cy="34" r="1.8" fill="#052e16"/>

  <!-- Beak -->
  <path d="M62 40 L74 41.5 L62 45.5 Z" fill="#fbbf24"/>

  <!-- Neck connector -->
  <path d="M42 50 L42 54 M58 50 L58 54" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

  <!-- Armor body -->
  <path d="M32 56 L32 86 Q32 94 50 94 Q68 94 68 86 L68 56 Q68 48 50 48 Q32 48 32 56 Z"
        stroke="url(#gIndigo)" stroke-width="4"/>

  <!-- Armor ribs / DMCR lines -->
  <path d="M32 64 Q50 68 68 64" stroke="#818cf8" stroke-width="2.5"/>
  <path d="M32 75 Q50 79 68 75" stroke="#818cf8" stroke-width="2.5"/>

  <!-- Wings -->
  <path d="M32 58 L16 65 L32 74" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 58 L84 65 L68 74" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wing feather tips -->
  <path d="M16 65 L10 60 M16 65 L10 70" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M84 65 L90 60 M84 65 L90 70" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Jet flames -->
  <path d="M42 94 L38 102 L50 96 L62 102 L58 94" stroke="url(#gBlue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
